name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux)
        # The sandbox deny-path tests assert against the real bwrap binary
        # rather than a model of it. Without this they skip, and the check
        # that matters most -- that our symlink verdict matches
        # bubblewrap's -- would never run in CI.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 blocks the unprivileged user namespaces bwrap
          # needs; without this the binary is present but cannot start.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true && echo "bwrap operational" || echo "bwrap present but cannot start; those tests will skip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run pytest
        # S9 (Issue #15) reads two variables here. S9_PROFILE selects the fault
        # injection profile: the PR matrix pays for the *fast* smoke subset
        # only, and the full matrix is a scheduled and gate concern (see
        # s9-full.yml). S9_SUITE_SEED is fixed rather than random so a red build
        # is reproducible from its own log -- the failure prints an S9-REPRO
        # line carrying it. On macOS and Windows the harness selects the
        # portable lane by itself; the Linux conformance lane is where gate
        # evidence is read from.
        env:
          S9_PROFILE: fast
          S9_SUITE_SEED: "20260820"
        run: python -m pytest -x -q
      - name: Control-plane suite against the S3 provider (gate item 11)
        # Issue #20: from this point on the control-plane suite is also run with
        # a live SessionProvider bound, so a session-backend detail leaking into
        # the control plane fails the build on the day it is introduced rather
        # than on the day the next provider arrives. Deliberately not -q: the
        # plugin's header line names the provider, its version and the session's
        # own state word, and that line is the run's evidence.
        #
        # S3 by name because it is the one provider that needs no Claude CLI and
        # no network, so this step means the same thing on every matrix row. The
        # run above already covers every *registered* provider -- tests/gate_item11
        # parameterises the same comparison over the registry -- and this step is
        # the legible, named one a reader of the log can find.
        run: python -m pytest tests/control_plane -p tests.gate_item11.provider_plugin
      - name: MessageBus static no-edge assertion (gate item 6)
        # Issue #19: ACCEPTANCE.md item 6 asks for the no-dependency-edge
        # property to be *enforced in CI, so a later edge fails the build
        # rather than being found at the gate*. The full run above already
        # collects this file; this named step exists so the assertion is
        # legible in the log and so its accidental disappearance (a moved
        # package, an emptied test file) fails loudly here -- the test guards
        # its own vacuity. Deliberately not -x/-q, matching the item 11 step:
        # the per-file parametrisation names every module that was checked.
        run: python -m pytest tests/messagebus/test_import_graph.py
