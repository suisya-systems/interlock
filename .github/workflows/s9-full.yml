name: s9-fault-injection (full)

# The full S9 matrix (Issue #15, docs/s9-fault-injection-harness.md section 9).
#
# It is deliberately not on the PR path. The 9-job PR matrix runs the fast smoke
# subset plus the cheap portable lane; the entire manifest is a nightly and gate
# concern, and I-11 / I-13 / I-15 read their evidence from this job's Linux
# conformance lane and from no other lane.
#
# The budgets are the manifest's, enforced by the harness's own watchdogs: the
# job-level timeout below is a backstop for a hang outside them, not the budget.

on:
  schedule:
    # 03:00 UTC daily. Nothing about the harness is time-dependent -- its clock
    # is injected -- so the hour is only about runner contention.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite_seed:
        description: "Suite seed (design 4.3). Leave empty for the recorded default."
        required: false
        type: string

jobs:
  full-matrix:
    name: full matrix (Linux conformance lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run the full fault-injection matrix
        env:
          S9_PROFILE: full
          S9_SUITE_SEED: ${{ inputs.suite_seed || '20260820' }}
        # Not -x: a fault-injection run is read as a matrix, and stopping at the
        # first failure hides how many other cases were affected by the same
        # cause. Deliberately not -q either -- the per-case ids are the record.
        run: python -m pytest tests/fault_injection -v
